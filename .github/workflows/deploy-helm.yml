name: Deploy Microservices on Kubernetes with Helm

on:
  push:
    branches:
      - main

jobs:
  helm-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Config Service
        run: |
          cd config-service
          mvn clean package -DskipTests

      - name: Build Discovery Service
        run: |
          cd discovery-service
          mvn clean package -DskipTests

      - name: Build Gateway Service
        run: |
          cd gateway-service
          mvn clean package -DskipTests

      - name: Build Catalogue Service
        run: |
          cd catalogue-service
          mvn clean package -DskipTests

      - name: Build Commande Service
        run: |
          cd commande-service
          mvn clean package -DskipTests

      - name: Build Paiement Service
        run: |
          cd paiement-service
          mvn clean package -DskipTests

      - name: Build Docker image config-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/config-service:latest ./config-service

      - name: Build Docker image discovery-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest ./discovery-service

      - name: Build Docker image gateway-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gateway-service:latest ./gateway-service

      - name: Build Docker image catalogue-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/catalogue-service:latest ./catalogue-service

      - name: Build Docker image commande-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/commande-service:latest ./commande-service

      - name: Build Docker image paiement-service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/paiement-service:latest ./paiement-service

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image config-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/config-service:latest

      - name: Push Docker image discovery-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/discovery-service:latest

      - name: Push Docker image gateway-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gateway-service:latest

      - name: Push Docker image catalogue-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/catalogue-service:latest

      - name: Push Docker image commande-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/commande-service:latest

      - name: Push Docker image paiement-service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/paiement-service:latest

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Config Chart
        run: helm lint ./charts/config-service

      - name: Lint Discovery Chart
        run: helm lint ./charts/discovery-service

      - name: Lint Gateway Chart
        run: helm lint ./charts/gateway-service

      - name: Lint Catalogue Chart
        run: helm lint ./charts/catalogue-service

      - name: Lint Commande Chart
        run: helm lint ./charts/commande-service

      - name: Lint Paiement Chart
        run: helm lint ./charts/paiement-service

      - name: Render Config Chart
        run: helm template config-service ./charts/config-service

      - name: Render Discovery Chart
        run: helm template discovery-service ./charts/discovery-service

      - name: Render Gateway Chart
        run: helm template gateway-service ./charts/gateway-service

      - name: Render Catalogue Chart
        run: helm template catalogue-service ./charts/catalogue-service

      - name: Render Commande Chart
        run: helm template commande-service ./charts/commande-service

      - name: Render Paiement Chart
        run: helm template paiement-service ./charts/paiement-service
